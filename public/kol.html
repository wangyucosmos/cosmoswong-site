<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>KOL 工作台</title>
<!-- 独立应用页：不走主站导航/页脚注入（tools/build_pages.mjs 的页面清单里没有它），不进 sitemap。数据只经 /api/kol 读写。 -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/kol/kol.css?v=20261004165646">
</head>
<body>
<form id="login" class="login" novalidate>
  <div class="login-card">
    <h1>KOL 工作台</h1>
    <label for="login-pw">请输入密码</label>
    <input id="login-pw" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">进入</button>
    <p id="login-msg" class="login-msg" role="status"></p>
    <noscript><p class="login-msg">这个页面需要开启 JavaScript。</p></noscript>
  </div>
</form>

<div id="app" hidden>
  <header class="topbar">
    <div class="brand"><span class="logo">K</span><span>KOL 工作台</span></div>
    <div class="search"><input id="q" type="search" placeholder="搜索名称、账号、邮箱、备注（按 / ）" aria-label="搜索" autocomplete="off"></div>
    <button id="new-kol" class="btn sm" type="button" title="快捷键 n">＋ 新建 KOL</button>
    <button id="open-settings" class="icon" type="button" aria-label="设置" title="设置">⚙️</button>
  </header>
  <nav id="tabs" class="tabs" aria-label="视图"></nav>
  <main id="main"></main>
</div>

<div id="drawer-backdrop" class="drawer-backdrop"></div>
<aside id="drawer" class="drawer" hidden aria-label="KOL 详情"><div id="drawer-body" class="drawer-body"></div></aside>

<dialog id="mail" class="dlg wide" aria-labelledby="mail-title">
  <div class="dlg-in">
    <header class="dlg-head"><h2 id="mail-title">邮件</h2>
      <div class="seg tabs-seg"><button type="button" data-tab="compose">写邮件</button><button type="button" data-tab="reply">回邮件</button></div>
      <button type="button" class="icon" data-mail-close aria-label="关闭">✕</button></header>
    <form id="mail-form" novalidate></form>
  </div>
</dialog>

<dialog id="newkol" class="dlg" aria-labelledby="newkol-title">
  <div class="dlg-in"><header class="dlg-head"><h2 id="newkol-title">新建 KOL</h2><button type="button" class="icon" data-close-new aria-label="关闭">✕</button></header>
  <div id="newkol-body"></div></div>
</dialog>

<dialog id="deal" class="dlg" aria-labelledby="deal-title">
  <div class="dlg-in"><header class="dlg-head"><h2 id="deal-title">带货记录</h2></header><div id="deal-body"></div></div>
</dialog>

<dialog id="io" class="dlg wide" aria-labelledby="io-title">
  <div class="dlg-in"><header class="dlg-head"><h2 id="io-title">导入</h2><button type="button" class="icon" data-io-close aria-label="关闭">✕</button></header><div id="io-body"></div></div>
</dialog>

<dialog id="confirm" class="dlg small" aria-labelledby="confirm-text">
  <div class="dlg-in"><p id="confirm-text"></p>
    <div class="row end"><button type="button" id="confirm-cancel" class="btn sm ghost">取消</button><button type="button" id="confirm-ok" class="btn sm danger">确认删除</button></div></div>
</dialog>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="/assets/kol/core.js?v=20261004165646"></script>
<script src="/assets/kol/model.js?v=20261004165646"></script>
<script src="/assets/kol/list.js?v=20261004165646"></script>
<script src="/assets/kol/board.js?v=20261004165646"></script>
<script src="/assets/kol/drawer.js?v=20261004165646"></script>
<script src="/assets/kol/mail.js?v=20261004165646"></script>
<script src="/assets/kol/finder.js?v=20261004165646"></script>
<script src="/assets/kol/deals.js?v=20261004165646"></script>
<script src="/assets/kol/io.js?v=20261004165646"></script>
<script src="/assets/kol/settings.js?v=20261004165646"></script>
<script src="/assets/kol/quality.js?v=20261004165646"></script>
<script src="/assets/kol/app.js?v=20261004165646"></script>
</body>
</html>
