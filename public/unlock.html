<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#05060d">
<title>需要口令</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/home/fonts.css?v=20261031101610">
<!-- 口令页（2026-10-31 起和首屏同一套深空）：输口令 = 一笔一笔点亮「CW 星座」；输对 → 星座变金、跃迁飞向目的地星球；输错 → 星星散开再归位。
     目的地星球按 next 决定（简历火星 / 知识库土星 / 工具木星），和二级页面页头同一套 WebGL 渲染。行为在 /assets/unlock.js，校验在 src/tools-gate.js。 -->
<style>
  :root{--space:#05060d;--fg:#f4f2ed;--muted:rgba(244,242,237,.74);--faint:rgba(244,242,237,.5);--line:rgba(244,242,237,.15);
    --accent:#ffc04a;--accent-ink:#241600;--acc-ink:#ffd27a;--e-out:cubic-bezier(.16,1,.3,1);color-scheme:dark;
    --f-display:"Unbounded","Noto Sans SC",system-ui,sans-serif;--f-cn:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--space);color:var(--fg);font:16px/1.7 var(--f-cn);-webkit-font-smoothing:antialiased}
  body{overflow:hidden}
  #sky{position:fixed;inset:0;width:100%;height:100%}
  .page-head{position:fixed;inset:0;pointer-events:none}
  .page-head .planet{position:absolute;right:-9vmin;bottom:-14vmin;width:min(62vmin,620px);aspect-ratio:1;opacity:0;
    transform:translate(var(--px,0px),var(--py,0px));animation:pin 2.4s .3s var(--e-out) forwards;transition:transform 1.2s var(--e-out)}
  [data-planet="saturn"] .planet{width:min(46vmin,460px);right:-4vmin;bottom:-6vmin}
  .planet-gl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:none}
  @keyframes pin{from{opacity:0;translate:0 60px}to{opacity:1;translate:0 0}}
  .warp .page-head .planet{transition:transform 2.6s cubic-bezier(.6,0,.2,1);transform:translate(calc(-50vw + 50% + 9vmin),calc(-50vh + 50% + 14vmin)) scale(2.4)}
  .brand{position:fixed;z-index:3;top:calc(16px + env(safe-area-inset-top,0px));left:max(24px,3vw);display:flex;align-items:center;gap:12px;color:var(--fg);text-decoration:none;font:700 20px var(--f-display)}
  .brand svg{width:44px;height:44px}
  main{position:relative;z-index:2;min-height:100%;display:grid;place-items:center;padding:24px 16px}
  .card{width:min(440px,100%);padding:30px 30px 26px;border-radius:26px;background:rgba(11,14,31,.5);border:1px solid var(--line);
    backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);box-shadow:0 40px 120px -40px #000;
    opacity:0;transform:translateY(28px);animation:up 1.1s .5s var(--e-out) forwards;transition:transform .9s var(--e-out),opacity .6s,filter .6s}
  @keyframes up{to{opacity:1;transform:none}}
  .eye{font:12px var(--f-mono);letter-spacing:.1em;color:var(--acc-ink);display:flex;align-items:center;gap:8px}
  .eye i{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:blink 2.4s infinite}
  @keyframes blink{50%{opacity:.25}}
  h1{font:800 30px/1.25 var(--f-cn);margin-top:12px}
  h1 .sp{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}
  h1 .ch{display:inline-block;transform:translateY(100%);filter:blur(6px);opacity:0;animation:ch .9s var(--e-out) forwards;animation-delay:calc(.7s + var(--i) * 40ms)}
  @keyframes ch{to{transform:none;filter:none;opacity:1}}
  .card>p{color:var(--muted);font-size:14px;margin-top:8px}
  /* 星座：十颗星按「C → W」的笔顺，每输一个字点亮下一颗并连线（多于十个字时金星脉动） */
  .cons{display:block;width:min(100%,260px);height:auto;margin:22px auto 10px;overflow:visible}
  .cons line{stroke:#dfe5ff;stroke-width:.7;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:.75;transition:stroke-dashoffset .45s var(--e-out),stroke .4s}
  .cons line.on{stroke-dashoffset:0}
  .cons .st{transform-box:fill-box;transform-origin:center}
  .cons .core{fill:#f4f2ed;opacity:.22;transition:opacity .3s,fill .3s}
  .cons .halo{fill:#dfe5ff;opacity:0;transition:opacity .4s,fill .4s}
  .cons .st.on .core{opacity:1}
  .cons .st.on .halo{opacity:.18}
  .cons .st.on{animation:pop .5s cubic-bezier(.34,1.8,.5,1)}
  @keyframes pop{40%{transform:scale(1.8)}}
  .cons .gold.on .core{fill:var(--accent)}
  .cons .gold.on .halo{fill:var(--accent);opacity:.3}
  .cons.more .gold{animation:pop .5s cubic-bezier(.34,1.8,.5,1)}
  .cons.bad line{stroke:#ff8a8a}
  .cons.win line{stroke:var(--acc-ink)}
  .cons.win .halo{opacity:.4;fill:var(--accent)}
  .cons.win .st{animation:flare 1s ease-out}
  @keyframes flare{30%{transform:scale(2.1)}}
  form{margin-top:12px}
  input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(5,6,13,.6);color:var(--fg);font:inherit;font-size:16px;letter-spacing:.2em;transition:border-color .3s,box-shadow .3s}
  input::placeholder{letter-spacing:0;color:var(--faint)}
  input:focus{outline:none;border-color:rgba(255,192,74,.6);box-shadow:0 0 0 4px rgba(255,192,74,.12)}
  button{position:relative;overflow:hidden;width:100%;margin-top:12px;padding:14px;border:0;border-radius:99px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:15px;cursor:pointer;transition:transform .5s var(--e-out),box-shadow .4s}
  button:hover{transform:translateY(-2px);box-shadow:0 14px 40px -12px rgba(255,192,74,.6)}
  button:disabled{opacity:.6;cursor:wait}
  button::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-130%);animation:sheen 4.5s 2s infinite}
  @keyframes sheen{0%,75%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
  :where(a,button,input):focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .err{min-height:20px;margin-top:10px;color:#ff9b9b;font-size:13px}
  .tip{color:var(--faint);font-size:12px}
  .card.shake{opacity:1;transform:none;animation:shake .5s}   /* 换掉入场动画后要自己保持可见 */
  @keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
  .card.leave{opacity:0;transform:scale(.92) translateY(-10px);filter:blur(6px)}
  .note{position:fixed;z-index:3;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font:11px var(--f-mono);color:var(--faint);letter-spacing:.08em;transition:color .6s}
  .warp .note{color:var(--acc-ink)}
  @media (max-width:600px){.page-head .planet{right:-30vmin;bottom:-22vmin;width:96vmin}[data-planet="saturn"] .planet{width:80vmin;right:-24vmin;bottom:-12vmin}.card{padding:24px 20px 20px}h1{font-size:25px}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card,h1 .ch,.page-head .planet{opacity:1;transform:none;filter:none}}
</style>
<script type="module" src="/assets/unlock.js?v=20261031101610"></script>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<section class="page-head" data-planet="jupiter" aria-hidden="true"><div class="planet"></div></section>
<a class="brand" href="/" aria-label="Cosmos Wong 首页"><svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="#f4f2ed" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity=".7"><polyline points="29,19.9 15,19.9 8,32 15,44.1 29,44.1"/><polyline points="35,20 40,44 46,31 52,44 57,20"/></g><g fill="#f4f2ed"><circle cx="29" cy="19.9" r="3.2"/><circle cx="15" cy="19.9" r="2.6"/><circle cx="8" cy="32" r="3.5"/><circle cx="15" cy="44.1" r="2.6"/><circle cx="29" cy="44.1" r="3"/><circle cx="35" cy="20" r="3"/><circle cx="40" cy="44" r="2.7"/><circle cx="52" cy="44" r="2.7"/><circle cx="57" cy="20" r="3.3"/></g><circle cx="46" cy="31" r="3.9" fill="#ffc04a"/></svg>Cosmos Wong</a>
<main>
  <div class="card" id="card">
    <p class="eye"><i></i><span id="dest">目的地 · 木星 / 工具箱</span></p>
    <h1 id="h1">需要口令</h1>
    <p id="lede">这个页面只对自己人开放。每输一个字，点亮一颗星。</p>
    <svg class="cons" id="cons" viewBox="0 6 64 52" aria-hidden="true"></svg>
    <form id="f" novalidate>
      <input id="pw" type="password" autocomplete="current-password" placeholder="输入口令" aria-label="口令" required>
      <button id="go" type="submit">点亮星座，进入</button>
      <div id="err" class="err" role="alert"></div>
      <div class="tip">输对一次，这台设备一年内不用再输。</div>
    </form>
  </div>
</main>
<p class="note" id="note">点星空任意处，放一颗流星</p>
</body>
</html>
