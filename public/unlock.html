<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>需要口令</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg:#0e0a1a; --card:#1a1530; --line:#ffffff1f; --ink:#f4f1ff; --muted:#a59fc0; --accent:#8b6cff; --red:#ff8a8a; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:radial-gradient(ellipse at 30% 0%, #3a1f78 0, transparent 60%), var(--bg); color:var(--ink); font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .card { width:min(380px, 100%); background:var(--card); border:1px solid var(--line); border-radius:20px; padding:32px 28px; box-shadow:0 24px 80px #00000055; }
  h1 { margin:0 0 8px; font-size:22px; }
  p { margin:0 0 22px; color:var(--muted); font-size:14px; line-height:1.7; }
  input { width:100%; padding:13px 14px; border-radius:11px; border:1px solid var(--line); background:#0e0a1a; color:var(--ink); font:inherit; font-size:16px; }
  input:focus-visible, button:focus-visible { outline:3px solid #8b6cff88; outline-offset:2px; }
  button { width:100%; margin-top:14px; padding:13px; border:0; border-radius:11px; background:var(--accent); color:#fff; font:inherit; font-weight:600; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .err { min-height:20px; margin-top:12px; color:var(--red); font-size:13px; }
  .tip { margin-top:6px; color:var(--muted); font-size:12px; }
</style>
<script type="module" src="/assets/unlock.js?v=20261019134627" defer></script>
</head>
<body>
<main class="card">
  <h1>需要口令</h1>
  <p>这个页面只对自己人开放，输入口令后即可继续。</p>
  <form id="f" novalidate>
    <input id="pw" type="password" autocomplete="current-password" placeholder="口令" aria-label="口令" required>
    <button id="go" type="submit">进入</button>
    <div id="err" class="err" role="alert"></div>
    <div class="tip">输对一次，这台设备一年内不用再输。</div>
  </form>
</main>
</body>
</html>
