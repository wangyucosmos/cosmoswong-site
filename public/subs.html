<main class="wrap">
  <section class="sec subs">
    <div class="sec-head">
      <div>
        <h2>订阅倒计时</h2>
        <p class="subs-lede">付费软件与服务：下次扣款还有几天，要不要继续订。</p>
      </div>
      <button id="subs-logout" class="btn glass sm" type="button" hidden>退出</button>
    </div>

    <form id="subs-lock" class="subs-lock" novalidate>
      <label for="subs-pw">这一页需要密码</label>
      <div class="subs-lock-row">
        <input id="subs-pw" name="password" type="password" autocomplete="current-password" required>
        <button class="btn solid sm" type="submit">进入</button>
      </div>
      <p id="subs-msg" class="subs-msg" role="status"></p>
      <noscript><p class="subs-msg">这一页需要开启 JavaScript。</p></noscript>
    </form>

    <div id="subs-app" hidden>
      <div id="subs-summary" class="subs-summary"></div>
      <div class="subs-toolbar">
        <div id="subs-filter" class="subs-filter" role="group" aria-label="按决定筛选"></div>
        <button id="subs-add" class="btn solid sm" type="button">＋ 新增</button>
      </div>
      <ul id="subs-list" class="subs-list"></ul>
      <p id="subs-updated" class="subs-foot"></p>
    </div>

    <dialog id="subs-edit" aria-labelledby="subs-edit-title">
      <form id="subs-form" class="modal subs-form" novalidate>
        <h2 id="subs-edit-title">编辑订阅</h2>
        <div class="subs-grid">
          <label class="wide">名称<input id="f-name" name="name" required maxlength="60"></label>
          <label class="wide">用途<input id="f-purpose" name="purpose" maxlength="120" placeholder="例：让 Claude 走固定美国 IP"></label>
          <label>价格<input id="f-price" name="price" type="number" step="0.01" min="0" inputmode="decimal"></label>
          <label>币种<select id="f-currency" name="currency"><option value="CNY">人民币 ¥</option><option value="USD">美元 US$</option></select></label>
          <label>周期<select id="f-cycle" name="cycle"><option>月</option><option>季</option><option>半年</option><option>年</option><option>一次性</option></select></label>
          <label>下次扣款<input id="f-next" name="next" type="date"></label>
          <label>决定<select id="f-verdict" name="verdict"><option>续订</option><option>待定</option><option>停掉</option></select></label>
          <label class="check"><input id="f-auto" name="auto" type="checkbox"> 自动续费</label>
          <label class="wide">取消入口<input id="f-cancel" name="cancel" maxlength="200" placeholder="例：Billing 页 Cancel Subscription"></label>
          <label class="wide">备注<textarea id="f-note" name="note" rows="3" maxlength="300"></textarea></label>
        </div>
        <p id="subs-form-msg" class="subs-msg" role="status"></p>
        <div class="subs-actions">
          <button id="subs-delete" class="btn glass sm danger" type="button">删除</button>
          <span class="grow"></span>
          <button id="subs-cancel" class="btn glass sm" type="button">取消</button>
          <button class="btn solid sm" type="submit">保存</button>
        </div>
      </form>
    </dialog>
  </section>
</main>
