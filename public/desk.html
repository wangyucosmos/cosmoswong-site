<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f6f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0b0e" media="(prefers-color-scheme: dark)">
<title>我的工作台</title>
<!-- 独立应用页：不走主站导航/页脚注入（tools/build_pages.mjs 的页面清单里没有它），不进 sitemap。数据只经 /api/desk 读写。
     v3：浅色 = 样稿 A，深色 = 样稿 B；theme.js 要最先加载，先定主题再画页面。
     v5：三种风格（经典 / 精密 / 玻璃），skins.css 只在 <html data-skin=precise|glass> 时生效，经典风格完全不受影响。 -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/assets/desk/theme.js?v=20261004161940"></script>
<link rel="stylesheet" href="/assets/desk/desk.css?v=20261004161940">
<link rel="stylesheet" href="/assets/desk/skins.css?v=20261004161940">
</head>
<body>
<form id="login" class="login" novalidate>
  <div class="login-card">
    <span class="logo">台</span>
    <h1>我的工作台</h1>
    <label for="login-pw">请输入密码</label>
    <input id="login-pw" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">进入</button>
    <p id="login-msg" class="login-msg" role="status"></p>
    <noscript><p class="login-msg">这个页面需要开启 JavaScript。</p></noscript>
  </div>
</form>

<div id="app" hidden>
  <aside class="side" aria-label="导航">
    <div class="brand"><span class="logo">台</span><span>我的工作台</span></div>
    <nav id="tabs" aria-label="页面"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <div class="mainwrap">
    <main id="main">
      <header id="head" class="head"></header>
      <div id="view" class="view"></div>
    </main>
  </div>
  <!-- 手机上的底部栏：今天 / 项目 / ＋收集 / 资源 / 更多 -->
  <nav id="bottombar" class="bottombar" aria-label="常用"></nav>
</div>

<dialog id="palette" class="pal" aria-label="搜索">
  <div class="pq"><span id="pal-icon"></span><input id="pal-q" placeholder="搜项目、待办、在等谁、资源、素材，或输入要做的事" autocomplete="off" aria-label="搜索"><kbd>esc</kbd></div>
  <div class="pr" id="pal-res" role="listbox"></div>
  <div class="pfoot"><span><kbd>↑</kbd> <kbd>↓</kbd> 选择</span><span><kbd>回车</kbd> 打开</span><span><kbd>⌘</kbd> <kbd>K</kbd> 随时呼出</span></div>
</dialog>

<dialog id="lightbox" class="lb" aria-label="看大图"></dialog>

<dialog id="capture" class="dlg" aria-labelledby="capture-title">
  <div class="dlg-in">
    <header class="dlg-head"><h2 id="capture-title">收集一条</h2><button type="button" class="icon" data-cap-close aria-label="关闭">✕</button></header>
    <textarea id="capture-text" rows="7" maxlength="20000" placeholder="把业务方的微信消息直接粘进来。回车保存，Shift+回车换行。" aria-label="收集内容"></textarea>
    <div class="row wrap"><div id="capture-src"></div><span class="grow"></span><button type="button" id="capture-save" class="btn sm">保存到收集箱</button></div>
  </div>
</dialog>

<dialog id="newproj" class="dlg" aria-labelledby="newproj-title">
  <div class="dlg-in"><header class="dlg-head"><h2 id="newproj-title">新建项目</h2><button type="button" class="icon" data-np-close aria-label="关闭">✕</button></header>
  <form id="newproj-form" novalidate></form></div>
</dialog>

<dialog id="wrapup" class="dlg wide" aria-labelledby="wrapup-title">
  <div class="dlg-in"><header class="dlg-head"><h2 id="wrapup-title">今天收工</h2><button type="button" class="icon" data-wrap-close aria-label="关闭">✕</button></header>
  <form id="wrapup-form" novalidate></form></div>
</dialog>

<dialog id="deliver" class="dlg" aria-labelledby="deliver-title">
  <div class="dlg-in"><header class="dlg-head"><h2 id="deliver-title">标成已交付</h2></header>
  <form id="deliver-form" novalidate></form></div>
</dialog>

<dialog id="backfill" class="dlg wide" aria-labelledby="backfill-title">
  <div class="dlg-in"><header class="dlg-head"><h2 id="backfill-title">贴回 AI 收工汇报</h2><button type="button" class="icon" data-bf-x aria-label="关闭">✕</button></header>
  <div id="backfill-body"></div></div>
</dialog>

<dialog id="win" class="dlg" aria-labelledby="win-title">
  <div class="dlg-in"><header class="dlg-head"><h2 id="win-title">记一条提效</h2><button type="button" class="icon" data-win-close aria-label="关闭">✕</button></header>
  <form id="win-form" novalidate></form></div>
</dialog>

<dialog id="initpack" class="dlg" aria-labelledby="initpack-title">
  <div class="dlg-in"><header class="dlg-head"><h2 id="initpack-title">导入初始化包</h2><button type="button" class="icon" data-ip-close aria-label="关闭">✕</button></header>
  <div id="initpack-body"></div></div>
</dialog>

<dialog id="pushprog" class="dlg wide" aria-labelledby="pushprog-title">
  <div class="dlg-in"><header class="dlg-head"><h2 id="pushprog-title">回写到 进度.md</h2><button type="button" class="icon" data-pp-close aria-label="关闭">✕</button></header>
  <div id="pushprog-body"></div></div>
</dialog>

<dialog id="sheet" class="dlg wide" aria-labelledby="sheet-title">
  <div class="dlg-in"><header class="dlg-head"><h2 id="sheet-title"></h2><button type="button" class="icon" data-sheet-close aria-label="关闭">✕</button></header>
  <div id="sheet-body"></div></div>
</dialog>

<dialog id="confirm" class="dlg small" aria-labelledby="confirm-text">
  <div class="dlg-in"><p id="confirm-text"></p>
    <div class="row end"><button type="button" id="confirm-cancel" class="btn sm ghost">取消</button><button type="button" id="confirm-ok" class="btn sm danger">确认删除</button></div></div>
</dialog>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="/assets/desk/core.js?v=20261004161940"></script>
<script src="/assets/desk/icons.js?v=20261004161940"></script>
<script src="/assets/desk/md.js?v=20261004161940"></script>
<script src="/assets/desk/ai.js?v=20261004161940"></script>
<script src="/assets/desk/waiting.js?v=20261004161940"></script>
<script src="/assets/desk/dash.js?v=20261004161940"></script>
<script src="/assets/desk/today.js?v=20261004161940"></script>
<script src="/assets/desk/projects.js?v=20261004161940"></script>
<script src="/assets/desk/inbox.js?v=20261004161940"></script>
<script src="/assets/desk/ideas.js?v=20261004161940"></script>
<script src="/assets/desk/wins.js?v=20261004161940"></script>
<script src="/assets/desk/records.js?v=20261004161940"></script>
<script src="/assets/desk/resources.js?v=20261004161940"></script>
<script src="/assets/desk/assets.js?v=20261004161940"></script>
<script src="/assets/desk/kb.js?v=20261004161940"></script>
<script src="/assets/desk/gh.js?v=20261004161940"></script>
<script src="/assets/desk/palette.js?v=20261004161940"></script>
<script src="/assets/desk/settings.js?v=20261004161940"></script>
<script src="/assets/desk/app.js?v=20261004161940"></script>
</body>
</html>
